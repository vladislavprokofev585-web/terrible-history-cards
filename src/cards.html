<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<style>
  html, body { margin: 0; padding: 0; background: #fff; }
  .card {
    width: 1080px; height: 1350px; box-sizing: border-box;
    background: #fff; color: #111;
    padding: 90px 90px 70px 90px;
    display: flex; flex-direction: column;
    font-family: Georgia, "Times New Roman", serif;
  }
  .text { flex: 1; overflow: hidden; line-height: 1.5; }
  .text p { margin: 0 0 0.65em 0; }
  .foot {
    border-top: 2px solid #111; padding-top: 24px; margin-top: 30px;
    font-family: Arial, Helvetica, sans-serif; font-size: 28px; letter-spacing: 1px; font-weight: 700;
  }
</style>
<script src="stories.js"></script>
</head>
<body>
<div class="card">
  <div class="text" id="text"></div>
  <div class="foot">@terrible_history</div>
</div>
<script>
const n = parseInt(new URLSearchParams(location.search).get("n") || "1", 10);
const t = document.getElementById("text");
t.innerHTML = window.STORIES[n - 1].map(p => "<p>" + p + "</p>").join("");
let fs = 50;
t.style.fontSize = fs + "px";
while (t.scrollHeight > t.clientHeight && fs > 24) { fs--; t.style.fontSize = fs + "px"; }
document.body.setAttribute("data-fs", fs);
document.body.setAttribute("data-over", t.scrollHeight > t.clientHeight ? "1" : "0");
</script>
</body>
</html>
